<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#efefe4" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141a15" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="BIZIYE" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/iconos/icono-180.png" />
		<script>
			// Aplica el tema guardado antes del primer pintado para evitar parpadeo.
			try {
				const tema = localStorage.getItem('biziye-tema');
				if (tema === 'claro' || tema === 'oscuro') {
					document.documentElement.dataset.theme = tema;
				}
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
